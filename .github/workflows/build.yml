name: Build binary cache (atuin, terraform)
on:
  # Every night at 04:30 UTC. Rebuilds against the current tip of the flake's
  # nixpkgs input and pushes the resulting store paths to Cachix so
  # `nixos-rebuild` gets a cache hit.
  schedule:
    - cron: "30 4 * * *"
  # Rebuild when the flake or patch changes.
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - patches/**
      - .github/workflows/build.yml
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

concurrency:
  group: build-atuin-cache
  cancel-in-progress: false

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake lock to latest nixpkgs
        if: github.event_name != 'push'
        run: nix flake update

      - name: Share the exact lock with both architecture jobs
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

      - name: Commit updated flake.lock
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: bump flake.lock (nightly atuin cache build)"
            git push
          fi

  build:
    needs: prepare-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the lock prepared once for this workflow run
        uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: .

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: jzl-atuin
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Confirm native architecture
        run: test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "${{ matrix.system }}"

      - name: Build patched atuin
        run: nix build ".#packages.${{ matrix.system }}.atuin" --out-link result-atuin --print-build-logs

      - name: Build terraform
        run: nix build ".#packages.${{ matrix.system }}.terraform" --out-link result-terraform --print-build-logs

      - name: Push and pin latest builds for this architecture
        run: |
          cachix push jzl-atuin ./result-atuin
          cachix pin jzl-atuin "atuin-${{ matrix.system }}" ./result-atuin --keep-revisions 1
          cachix push jzl-atuin ./result-terraform
          cachix pin jzl-atuin "terraform-${{ matrix.system }}" ./result-terraform --keep-revisions 1
